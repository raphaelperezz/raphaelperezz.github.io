<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Hanken Grotesk','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2a44"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f8276"/>
    </marker>
    <linearGradient id="comp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7eef6"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeef0"/>
      <stop offset="1" stop-color="#a3d9df"/>
    </linearGradient>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d2a44" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>

  <!-- ===== top band: legend (left) + TDH callout (right) ===== -->
  <g>
    <rect x="56" y="54" width="312" height="86" rx="12" fill="#f5f8fb" stroke="#dde5ee" stroke-width="1.5"/>
    <line x1="78" y1="86" x2="120" y2="86" stroke="#1d2a44" stroke-width="6" stroke-linecap="round"/>
    <line x1="78" y1="86" x2="120" y2="86" stroke="#0f8276" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/>
    <text x="134" y="91" font-size="16" font-weight="600" fill="#22324e">Pressurized supply line</text>
    <line x1="78" y1="116" x2="120" y2="116" stroke="#0f8276" stroke-width="6" stroke-dasharray="9 11" stroke-linecap="round"/>
    <text x="134" y="121" font-size="16" font-weight="600" fill="#22324e">Gravity return (no pump)</text>
  </g>
  <g>
    <rect x="592" y="54" width="312" height="86" rx="12" fill="#f1f9f7" stroke="#0f8276" stroke-width="2"/>
    <text x="614" y="86" font-size="14" font-weight="700" letter-spacing="1.6" fill="#5a6b86">TOTAL DYNAMIC HEAD</text>
    <text x="614" y="121" font-size="30" font-weight="800" fill="#0f8276">36.0 m<tspan font-size="18" font-weight="600" fill="#5a6b86">  (118 ft)</tspan></text>
  </g>

  <!-- ===== pipes (drawn first, components overlay) ===== -->
  <!-- supply: tank -> pump -> valve -> press, single inline run -->
  <line x1="240" y1="380" x2="770" y2="380" stroke="#1d2a44" stroke-width="8" stroke-linecap="round"/>
  <line x1="240" y1="380" x2="770" y2="380" stroke="#3ad0c0" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <!-- supply flow arrows (clear of all labels) -->
  <path d="M272,380 h2" stroke="#1d2a44" stroke-width="8" marker-end="url(#arr)"/>
  <path d="M648,380 h2" stroke="#1d2a44" stroke-width="8" marker-end="url(#arr)"/>

  <!-- gravity return: press bottom -> down -> across -> up -> tank -->
  <polyline points="905,470 905,560 50,560 50,380 90,380" fill="none" stroke="#0f8276" stroke-width="6" stroke-dasharray="9 11" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
  </polyline>
  <path d="M462,560 h-2" stroke="#0f8276" stroke-width="6" marker-end="url(#arrt)"/>

  <!-- ===== components ===== -->
  <!-- supply tank -->
  <g filter="url(#ds)">
    <rect x="90" y="270" width="150" height="210" rx="14" fill="url(#comp)" stroke="#1d2a44" stroke-width="5"/>
    <rect x="101" y="354" width="128" height="118" rx="7" fill="url(#liq)"/>
  </g>
  <text x="165" y="516" text-anchor="middle" font-size="24" font-weight="600" fill="#22324e">Supply tank</text>

  <!-- pump (spinning impeller) -->
  <g filter="url(#ds)"><circle cx="330" cy="380" r="44" fill="url(#comp)" stroke="#1d2a44" stroke-width="5"/></g>
  <g transform="translate(330,380)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite" additive="sum"/>
    <g stroke="#0f8276" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M0,0 Q15,-8 34,-3"/>
      <path d="M0,0 Q15,-8 34,-3" transform="rotate(60)"/>
      <path d="M0,0 Q15,-8 34,-3" transform="rotate(120)"/>
      <path d="M0,0 Q15,-8 34,-3" transform="rotate(180)"/>
      <path d="M0,0 Q15,-8 34,-3" transform="rotate(240)"/>
      <path d="M0,0 Q15,-8 34,-3" transform="rotate(300)"/>
    </g>
    <circle r="8" fill="#1d2a44"/>
  </g>
  <text x="330" y="460" text-anchor="middle" font-size="24" font-weight="700" fill="#0f8276">Pump · 3 hp</text>

  <!-- globe valve -->
  <g filter="url(#ds)">
    <path d="M467,380 L493,366 L493,394 Z M493,380 L467,366 L467,394 Z" fill="url(#comp)" stroke="#1d2a44" stroke-width="4.5"/>
    <line x1="480" y1="366" x2="480" y2="346" stroke="#1d2a44" stroke-width="4.5"/>
    <line x1="468" y1="346" x2="492" y2="346" stroke="#1d2a44" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="480" y="436" text-anchor="middle" font-size="22" font-weight="600" fill="#22324e">Globe valve</text>

  <!-- hydraulic press -->
  <g filter="url(#ds)">
    <rect x="770" y="285" width="165" height="185" rx="14" fill="url(#comp)" stroke="#1d2a44" stroke-width="5"/>
    <rect x="805" y="307" width="96" height="28" rx="5" fill="#1d2a44"/>
    <rect x="843" y="335" width="20" height="58" fill="#9fb0c8"/>
    <rect x="812" y="393" width="82" height="30" rx="5" fill="#cdd8e8" stroke="#1d2a44" stroke-width="3"/>
  </g>
  <text x="853" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">50 psia</text>
  <text x="853" y="262" text-anchor="middle" font-size="24" font-weight="600" fill="#22324e">Hydraulic press</text>

  <!-- flow-rate label above the discharge run, clear of pipe and arrow -->
  <text x="566" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#22324e">30 to 40 GPM</text>

  <!-- return label below its run -->
  <text x="462" y="594" text-anchor="middle" font-size="22" font-weight="600" fill="#0f8276">Gravity return · 2 in pipe</text>
</svg>
